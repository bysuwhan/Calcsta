<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <script>
      const route = new URLSearchParams(location.search).get('route');
      if (route) {
        const target = new URL(route, location.origin);
        if (target.origin === location.origin) {
          target.searchParams.delete('route');
          history.replaceState(null, '', target.pathname + target.search + target.hash);
        }
      } else if (location.pathname === '/') {
        location.replace('/app/basic' + location.search + location.hash);
      }
    </script>
    <meta name="description" content="Calcsta structural analysis editor." />
    <meta name="theme-color" content="#0c1620" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>Calcsta</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
